version: 2

# web/dist is built by the CI step before goreleaser runs (see
# .github/workflows/release.yml) — web/embed.go's `//go:embed all:dist`
# needs it populated at compile time, same requirement as the Dockerfile.

builds:
  - id: elara
    main: ./cmd/service
    binary: elara
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: elara
    ids: [elara]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# Release notes are produced by git-cliff and handed to goreleaser via
# --release-notes (see .github/workflows/release.yml), so its built-in
# changelog is switched off. Keeping both meant two groupings competing for
# the same release body, and goreleaser's has no BREAKING CHANGE handling —
# the v0.5.0 notes went out with no breaking-changes section for a release
# that had three. cliff.toml is now the single source of truth for both the
# GitHub Release body and CHANGELOG.md.
changelog:
  disable: true

release:
  # No other job creates a GitHub Release for the vX.Y.Z tag (the Helm
  # chart's chart-releaser publishes separate elara-X.Y.Z releases), so
  # goreleaser is the one that creates it — mode: append just means a
  # second goreleaser run for the same tag adds to it rather than failing.
  mode: append
