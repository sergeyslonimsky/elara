version: 2

# web/dist is built by the CI step before goreleaser runs (see
# .github/workflows/release.yml) — web/embed.go's `//go:embed all:dist`
# needs it populated at compile time, same requirement as the Dockerfile.

builds:
  - id: elara
    main: ./cmd/service
    binary: elara
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: elara
    ids: [elara]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# Release notes are produced by git-cliff and handed to goreleaser via
# --release-notes (see .github/workflows/release.yml). cliff.toml is the
# single source of truth for both the GitHub Release body and CHANGELOG.md —
# goreleaser's own grouping has no BREAKING CHANGE handling, which is how the
# v0.5.0 notes went out with no breaking-changes section for a release that
# had three.
#
# Do NOT set `disable: true` here. The --release-notes file is loaded *by*
# this pipe, so disabling it drops the flag on the floor and publishes an
# empty release body — that is what happened to v0.5.1-rc.2. The flag already
# suppresses goreleaser's own generation on its own ("will skip GoReleaser
# changelog generation" per `goreleaser release --help`), so the pipe must
# stay enabled for the flag to be read at all.
changelog:
  use: git

release:
  # No other job creates a GitHub Release for the vX.Y.Z tag (the Helm
  # chart's chart-releaser publishes separate elara-X.Y.Z releases), so
  # goreleaser is the one that creates it — mode: append just means a
  # second goreleaser run for the same tag adds to it rather than failing.
  mode: append
  # Make asset upload idempotent. v0.5.1-rc.2 uploaded all five artifacts,
  # then goreleaser's retry re-POSTed them and GitHub answered
  # `422 already_exists`, failing the job over a release that was in fact
  # complete. With this set, an upload that retries replaces the asset instead
  # of colliding with it.
  replace_existing_artifacts: true
  # Mark a tag carrying a semver prerelease suffix (v1.2.3-rc.1) as a
  # GitHub pre-release. Without this goreleaser defaults to false and an rc
  # is published as a full release, which makes it the repository's "Latest"
  # — displayed above the newest stable version on the releases page and
  # returned by the releases/latest API that install scripts follow.
  prerelease: auto
