name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Cancel in-progress runs for the same branch/PR — save Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend test, lint & build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      - name: Test frontend
        working-directory: web
        run: npm run test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: web/coverage/lcov.info

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/lcov.info
          flags: frontend

      - name: Upload frontend test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/test-results/junit.xml
          flags: frontend

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Upload frontend assets
        uses: actions/upload-artifact@v7
        with:
          name: frontend-assets
          path: web/dist

  go:
    name: Go test & lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # web/embed.go uses //go:embed all:dist, so go vet/go build/go test
      # require a populated web/dist directory.
      # Since frontend build is parallel, we create an empty file in dist
      # to satisfy the embed requirement without waiting for the full build.
      - name: Create dummy dist for go:embed
        run: |
          mkdir -p web/dist
          touch web/dist/.gitkeep

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod verify
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      # -tags=integration is required: the handler integration suites are all
      # behind that build tag, so without it CI silently compiles and runs
      # none of them — `go test ./...` still reports success.
      #
      # -coverpkg is required for those suites to count. They live in the
      # handler packages but exercise code in usecase/, service/ and storage/;
      # with per-package coverage (the default) Go attributes none of it, so
      # a usecase covered only by an integration test reads as 0%.
      - name: Test (race)
        run: go tool gotestsum --format=testname --hide-summary=output --junitfile junit.xml -- -race -count=1 -shuffle=on -tags=integration -coverpkg=./internal/... -coverprofile=coverage.txt ./...

      - name: Filter generated files from coverage
        run: grep -vE "\.pb\.go:|\.connect\.go:" coverage.txt > coverage_filtered.txt && mv coverage_filtered.txt coverage.txt

      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
          flags: backend

      - name: Upload Go test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          flags: backend

      - name: Upload Go coverage report
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.txt

  bench:
    name: Benchmarks vs base
    permissions:
      contents: read
    # Only on a pull request: on a push to master there is no "before" side to
    # compare against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 so the base commit is available locally — the baseline
      # is produced by checking it out, not by downloading an artifact.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same go:embed constraint as the go job. web/dist is untracked, so this
      # survives the git checkouts below and only needs creating once.
      - name: Create dummy dist for go:embed
        run: |
          mkdir -p web/dist
          touch web/dist/.gitkeep

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # -skip=_Durable drops the fsync benchmarks. They are the honest
      # production latency, but on a shared runner the disk is the noisiest
      # thing available and would swamp a comparison that is about code.
      #
      # -count=6 is not arbitrary: benchstat needs at least 6 samples to report
      # a confidence interval at level 0.95, and below that it prints bare
      # numbers with no indication of whether a difference means anything.
      # -benchtime=200ms keeps the job predictable at that sample count.
      #
      # set -o pipefail is required, not cosmetic: piping into tee would
      # otherwise hand the step tee's exit code and a benchmark that panics or
      # fails to build would pass silently — the exact rot this job exists to
      # prevent.
      - name: Benchmark base commit
        run: |
          set -o pipefail
          git checkout --detach ${{ github.event.pull_request.base.sha }}
          go test -run='^$' -bench=. -skip=_Durable -benchmem \
            -benchtime=200ms -count=6 ./internal/... | tee base.txt

      - name: Benchmark pull request
        run: |
          set -o pipefail
          git checkout --detach ${{ github.event.pull_request.head.sha }}
          go test -run='^$' -bench=. -skip=_Durable -benchmem \
            -benchtime=200ms -count=6 ./internal/... | tee new.txt

      # Informational, not a gate. benchstat on a shared runner reports real
      # regressions and imaginary ones in roughly equal measure; failing the
      # job on its verdict would train everyone to ignore it. The job still
      # fails if a benchmark stops compiling or starts erroring, which is what
      # actually keeps them from rotting.
      #
      # The `||` fallback is insurance only. A base side with no matching
      # benchmarks — the PR that first adds them, for instance — is not an
      # error to benchstat: it exits 0 and prints the new side alone. The
      # fallback exists so that a malformed input cannot turn an informational
      # step into a red job.
      - name: Compare
        run: |
          {
            echo '## Benchmarks vs base'
            echo
            echo '```'
            go tool benchstat base.txt new.txt || echo 'no benchmarks in common with the base commit'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: |
            base.txt
            new.txt

  proto:
    name: Proto lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Pinned by SHA and given a token deliberately. buf-setup-action
      # resolves its download URL through the GitHub API, and on a shared
      # runner IP the unauthenticated quota is routinely exhausted by other
      # tenants — the job then fails with "API rate limit exceeded" on a PR
      # that touches no proto at all. The token moves the call to the
      # repository's own 5000/hr budget.
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: buf lint
      - run: buf breaking --against 'https://github.com/${{ github.repository }}.git#branch=master'
        if: github.event_name == 'pull_request'
        continue-on-error: true

  helm:
    name: Helm lint & template
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.17.3

      - name: Helm lint
        run: helm lint helm/elara/

      - name: Helm template (defaults)
        run: helm template elara helm/elara/ > /tmp/default.yaml

      - name: Helm template (all features)
        run: |
          helm template elara helm/elara/ \
            --set ingress.enabled=true \
            --set metrics.enabled=true \
            --set metrics.serviceMonitor.enabled=true \
            --set networkPolicy.enabled=true \
            --set tracing.enabled=true \
            --set tracing.otlpEndpoint=http://otel:4318 \
            > /tmp/full.yaml

      - name: Schema rejects invalid values
        run: |
          if helm template elara helm/elara/ --set replicaCount=2 > /dev/null 2>&1; then
            echo "schema must reject replicaCount=2"; exit 1
          fi
          if helm template elara helm/elara/ --set storage.type=postgres > /dev/null 2>&1; then
            echo "schema must reject storage.type=postgres"; exit 1
          fi

  sonarcloud:
    name: SonarCloud
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor != 'dependabot[bot]'
    needs: [go, frontend]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download Go coverage report
        uses: actions/download-artifact@v8
        with:
          name: go-coverage
      - name: Download frontend coverage report
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: web/coverage
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e # master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Docker build
    permissions:
      contents: read
    needs: [frontend, go]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Download frontend assets
        uses: actions/download-artifact@v8
        with:
          name: frontend-assets
          path: web/dist

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
