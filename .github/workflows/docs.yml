name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"

# Cancel in-progress runs for the same branch — save Actions minutes.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # peaceiris/actions-gh-pages pushes the built site to gh-pages

jobs:
  build-deploy:
    name: Build & deploy MkDocs site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: "pip install --only-binary :all: mkdocs-material==9.7.7"

      - name: Build site
        run: mkdocs build --strict

      # NOTE: gh-pages also hosts the Helm chart repository (index.yaml + chart
      # tarballs) published by release.yml. keep_files: true preserves those
      # artifacts so the docs site and the Helm repo coexist on the same branch.
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
