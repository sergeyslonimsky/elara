syntax = "proto3";

package elara.token.v1;

import "elara/common/v1/permission.proto";
import "google/protobuf/timestamp.proto";

message Token {
  string id = 1;
  // Prefix the issuer chose. Not unique — use username to identify a token.
  string name = 2;
  string issued_by = 3;
  repeated string namespaces = 4;
  elara.common.v1.PermissionAction permission = 5;
  optional google.protobuf.Timestamp expires_at = 6;
  optional google.protobuf.Timestamp last_used_at = 7;
  string last_used_ip = 8;
  google.protobuf.Timestamp created_at = 9;
  // Globally unique, immutable login: name + "-" + server-generated suffix.
  // etcd clients present it as the user name, with the raw token as the
  // password (`etcdctl --user <username>:<raw token>`).
  string username = 10;
}
