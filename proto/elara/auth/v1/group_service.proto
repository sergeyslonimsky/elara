syntax = "proto3";

package elara.auth.v1;

import "elara/auth/v1/permission.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/sergeyslonimsky/elara/internal/proto/elara/auth/v1;authv1";

message Group {
  string id = 1;
  string name = 2;
  repeated string members = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  // is_system flags built-in groups (e.g. `admins`) that the server protects
  // from deletion, renaming, and removing their last member. Clients should
  // disable destructive UI actions when this is true.
  bool is_system = 6;
  string description = 7;
  int64 version = 8;
  repeated PermissionAssignment permissions = 9;
}

message CreateGroupRequest {
  string name = 1;
}

message CreateGroupResponse {
  Group group = 1;
}

message GetGroupRequest {
  string id = 1;
}

message GetGroupResponse {
  Group group = 1;
}

message UpdateGroupRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated PermissionAssignment permissions = 4;
  repeated string members = 5;
  int64 version = 6;
}

message UpdateGroupResponse {
  Group group = 1;
}

message DeleteGroupRequest {
  string id = 1;
}

message DeleteGroupResponse {}

message ListGroupsRequest {}

message ListGroupsResponse {
  repeated Group groups = 1;
}

service GroupService {
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  rpc GetGroup(GetGroupRequest) returns (GetGroupResponse);
  rpc UpdateGroup(UpdateGroupRequest) returns (UpdateGroupResponse);
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse);
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
}
