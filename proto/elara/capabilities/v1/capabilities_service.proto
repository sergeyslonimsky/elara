syntax = "proto3";

package elara.capabilities.v1;

service CapabilitiesService {
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
}

message GetCapabilitiesRequest {}

message GetCapabilitiesResponse {
  // Whether the etcd-compatible gRPC API requires a service token (client.auth.enabled).
  // When false, TokenService is not mounted and issuing/managing tokens is meaningless.
  bool etcd_token_auth_enabled = 1;

  // Whether UI login is enabled (ui.auth.enabled). When false, UserService/GroupService
  // are not mounted — there is no concept of managing users/groups in single-user mode.
  bool user_management_enabled = 2;
}
