apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "elara.configMapName" . }}
  labels:
    {{- include "elara.labels" . | nindent 4 }}
data:
  # Env-var names follow Viper's SetEnvKeyReplacer(".", "_") rule:
  # dotted config key → uppercased underscores (camelCase tokens are NOT split).
  # e.g. ui.server.readTimeout → UI_SERVER_READTIMEOUT

  # HTTP/2 server (ConnectRPC + Web UI)
  UI_SERVER_PORT: {{ .Values.config.ui.server.port | quote }}
  UI_SERVER_READTIMEOUT: {{ .Values.config.ui.server.readTimeout | quote }}
  UI_SERVER_WRITETIMEOUT: {{ .Values.config.ui.server.writeTimeout | quote }}

  # gRPC server (etcd-compatible API)
  CLIENT_ETCD_PORT: {{ .Values.config.client.etcd.port | quote }}

  # Service identity (used as Prometheus / OTel resource labels)
  SERVICE_NAME: {{ include "elara.serviceName" . | quote }}
  SERVICE_VERSION: {{ .Chart.AppVersion | quote }}

  # Connected-clients monitor (in-memory, etcd API)
  CLIENT_HISTORY_MAX_RECORDS: {{ .Values.config.client.history.maxRecords | quote }}
  CLIENT_HISTORY_MAX_AGE: {{ .Values.config.client.history.maxAge | quote }}
  CLIENT_RECENT_EVENTS_CAPACITY: {{ .Values.config.client.recentEvents.capacity | quote }}

  # Observability (opt-in)
  METRICS_ENABLED: {{ .Values.metrics.enabled | quote }}
  TRACING_ENABLED: {{ .Values.tracing.enabled | quote }}
  {{- if .Values.tracing.otlpEndpoint }}
  TRACING_OTLP_ENDPOINT: {{ .Values.tracing.otlpEndpoint | quote }}
  {{- end }}

  # Logging
  LOG_LEVEL: {{ .Values.config.log.level | quote }}
  LOG_FORMAT: {{ .Values.config.log.format | quote }}
  LOG_NOSOURCE: {{ .Values.config.log.noSource | quote }}

  # Storage backend — bbolt keeps its single db file in CONFIG_DATA_PATH.
  {{- if eq .Values.storage.type "bbolt" }}
  CONFIG_DATA_PATH: {{ .Values.storage.bbolt.path | quote }}
  {{- end }}

  # Authentication (opt-in — sensitive values go to the auth Secret, not here)
  UI_AUTH_ENABLED: {{ .Values.config.ui.auth.enabled | quote }}
  {{- if .Values.config.ui.auth.enabled }}
  UI_AUTH_TYPE: {{ .Values.config.ui.auth.type | quote }}
  UI_AUTH_ADMINEMAIL: {{ .Values.config.ui.auth.adminEmail | quote }}
  UI_AUTH_SESSION_TTL: {{ .Values.config.ui.auth.session.ttl | quote }}
  {{- if eq .Values.config.ui.auth.type "oidc" }}
  UI_AUTH_OIDC_ISSUERURL: {{ .Values.config.ui.auth.oidc.issuerUrl | quote }}
  UI_AUTH_OIDC_CLIENTID: {{ .Values.config.ui.auth.oidc.clientId | quote }}
  UI_AUTH_OIDC_REDIRECTURL: {{ .Values.config.ui.auth.oidc.redirectUrl | quote }}
  {{- if .Values.config.ui.auth.oidc.scopes }}
  UI_AUTH_OIDC_SCOPES: {{ join "," .Values.config.ui.auth.oidc.scopes | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
