sonar.projectKey=sergeyslonimsky_elara
sonar.organization=sergeyslonimsky

sonar.sources=.
sonar.exclusions=**/*.pb.go,**/*.connect.go,internal/proto/**/*,**/gen/**/*.ts,vendor/**/*,**/mocks/**,examples/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,**/src/test/**,test/**

sonar.coverage.exclusions=**/*.pb.go,**/*.connect.go,internal/proto/**/*,**/gen/**/*.ts,vendor/**/*,cmd/**,internal/di/**/*,**/*_test.go,**/mocks/**,**/*.test.ts,**/*.test.tsx,**/src/test/**,examples/**,test/**,internal/handler/ui/**,web/src/components/ui/sidebar.tsx,web/src/components/ui/chart.tsx,internal/storage/storagetest/**

sonar.go.coverage.reportPaths=coverage.txt
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info

# Per-rule exemptions: rules that fire on patterns we intentionally keep.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7
# go:S1192 duplicated string literals — Go's idiomatic fmt.Errorf("entity %s: %w", ...) pattern
# repeats by design across error sites within a repository file. Extracting constants
# hurts readability and violates idiomatic error wrapping.
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=internal/storage/**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.e2.resourceKey=internal/service/auth/**/*
# kubernetes:S6870 storage limit — Helm templates parameterize resources via values.yaml,
# Sonar can't statically resolve the substitution and reports false positives.
sonar.issue.ignore.multicriteria.e3.ruleKey=kubernetes:S6870
sonar.issue.ignore.multicriteria.e3.resourceKey=helm/**/*
# typescript:S1082/S6847/S6853 — shadcn-ui copies are imported verbatim per the shadcn
# convention; modifying them detaches from upstream and creates maintenance debt.
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S1082
sonar.issue.ignore.multicriteria.e4.resourceKey=web/src/components/ui/**/*
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S6847
sonar.issue.ignore.multicriteria.e5.resourceKey=web/src/components/ui/**/*
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S6853
sonar.issue.ignore.multicriteria.e6.resourceKey=web/src/components/ui/**/*
# godre:S8196 single-method interface naming — Effective Go's "-er" suffix convention
# targets exported standardised interfaces (io.Reader/Writer). Consumer-side inline
# interfaces (accept-interfaces-return-structs pattern) intentionally use descriptive
# names like userLookup or sessionsService and shouldn't be forced into the suffix.
sonar.issue.ignore.multicriteria.e7.ruleKey=godre:S8196
sonar.issue.ignore.multicriteria.e7.resourceKey=**/*
