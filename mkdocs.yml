site_name: Elara
site_description: Configuration management service with a Web UI, a ConnectRPC API, and an etcd-compatible gRPC API.
repo_url: https://github.com/sergeyslonimsky/elara
repo_name: sergeyslonimsky/elara

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.instant
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - content.code.copy
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting Started:
      - Install: getting-started/install.md
      - Quickstart: getting-started/quickstart.md
      - Todo-App Tutorial: getting-started/tutorial-todo-app.md
  - Concepts:
      - concepts/index.md
      - Namespaces & Configs: concepts/namespaces-configs.md
      - Schema Validation: concepts/schema-validation.md
      - Bundles: concepts/bundles.md
      - Watch & Revisions: concepts/watch-revisions.md
      - Webhooks: concepts/webhooks.md
      - Clients & Observability: concepts/clients-observability.md
  - Auth & Access:
      - auth/index.md
      - Basic Auth: auth/basic.md
      - OIDC: auth/oidc.md
      - Passthrough: auth/passthrough.md
      - Sessions & Tokens: auth/sessions-tokens.md
      - "RBAC, Groups & Roles": auth/rbac-groups.md
      - Client Auth (etcd): auth/client-auth.md
      - Users & Groups lifecycle: auth/users-lifecycle.md
  - Deployment:
      - deployment/index.md
      - Docker: deployment/docker.md
      - Kubernetes (Helm): deployment/kubernetes.md
      - Configuration reference: deployment/configuration.md
  - Reference:
      - reference/index.md
      - CLI: reference/cli.md
      - etcd API compatibility: reference/etcd-compatibility.md
      - ConnectRPC API: reference/connectrpc-api.md
      - Errors catalog: reference/errors-catalog.md
      - Troubleshooting & FAQ: reference/troubleshooting.md
  - Architecture:
      - Overview: architecture.md
      - "ADR 0001: Usecase-owned Transactions": adr/0001-usecase-owned-transactions.md
      - "ADR 0002: Groups-only RBAC": adr/0002-groups-only-rbac.md
