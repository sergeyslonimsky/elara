site_name: Elara
site_description: Configuration management service with a Web UI, a ConnectRPC API, and an etcd-compatible gRPC API.
repo_url: https://github.com/sergeyslonimsky/elara
repo_name: sergeyslonimsky/elara

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.instant
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - content.code.copy
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: quickstart.md
      - Configuration: configuration.md
  - Concepts: concepts.md
  - Authentication: authentication.md
  - Guides:
      - Todo-App Tutorial: tutorial-todo-app.md
  - Architecture:
      - Overview: architecture.md
      - "ADR 0001: Usecase-owned Transactions": adr/0001-usecase-owned-transactions.md
      - "ADR 0002: Groups-only RBAC": adr/0002-groups-only-rbac.md
